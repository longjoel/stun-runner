regions:
  - name: main_input_in0
    processor: maincpu
    start: 0x60c000
    end: 0x60c001
    access: read
    evidence: MAME-CONFIRMED
    candidate_selector: input.in0
    notes:
      - input-port definition documents IN0 at 0x60c000
      - bit 0x01 is diagnostic jumper in mined source revision

  - name: adsp_program_window
    processor: maincpu
    start: 0x800000
    end: 0x807fff
    access: rw
    evidence: MAME-CONFIRMED
    candidate_selector: adsp.program
    mame_handlers:
      - hd68k_adsp_program_r
      - hd68k_adsp_program_w
    notes:
      - ADSP program map is RAM at 0x0000-0x1fff in the target MAME configuration
      - the target ROM manifest has no separate ADSP program-code region
      - the 0x60000-byte mainpcb:user1 region is object ROM, not identified as executable ADSP program storage

  - name: jsa_main_command_response_window
    processor: maincpu
    start: 0x600000
    end: 0x603fff
    access: rw
    evidence: MAME-CONFIRMED
    candidate_selector: sound.jsa.main_command_response
    mame_handlers:
      - atari_jsa_base_device::main_response_r
      - atari_jsa_base_device::main_command_w
    notes:
      - dynamically installed by init_multisync(0) when the JSA device is present
      - handler installation uses an 0xff00 mask

  - name: adsp_data_window
    processor: maincpu
    start: 0x808000
    end: 0x80bfff
    access: rw
    evidence: MAME-CONFIRMED
    candidate_selector: adsp.data
    mame_handlers:
      - hd68k_adsp_data_r
      - hd68k_adsp_data_w

  - name: adsp_serial_buffer_window
    processor: maincpu
    start: 0x810000
    end: 0x813fff
    access: rw
    evidence: MAME-CONFIRMED
    candidate_selector: adsp.serial_buffer
    mame_handlers:
      - hd68k_adsp_buffer_r
      - hd68k_adsp_buffer_w

  - name: adsp_control_window
    processor: maincpu
    start: 0x818000
    end: 0x81801f
    access: write
    evidence: MAME-CONFIRMED
    candidate_selector: adsp.control
    mame_handlers:
      - hd68k_adsp_control_w
    notes:
      - low offset selects bank, /BR, or /HALT behavior in the MAME model

  - name: adsp_irq_clear_window
    processor: maincpu
    start: 0x818060
    end: 0x81807f
    access: write
    evidence: MAME-CONFIRMED
    candidate_selector: adsp.irq_clear
    mame_handlers:
      - hd68k_adsp_irq_clear_w

  - name: adsp_irq_state_window
    processor: maincpu
    start: 0x838000
    end: 0x83ffff
    access: read
    evidence: MAME-CONFIRMED
    candidate_selector: adsp.irq_state
    mame_handlers:
      - hd68k_adsp_irq_state_r

  - name: adc_12bit_channel_3_landmark
    processor: maincpu
    start: 0xb80000
    end: 0xb80001
    access: read
    evidence: MAME-CONFIRMED
    candidate_selector: input.adc12.ch3
    notes:
      - address comes from MAME input-port comment and must be confirmed against canonical runtime map

relationships:
  - from: adsp
    to: maincpu
    kind: interrupt_signal_and_ack
    evidence: MAME-CONFIRMED plus OBSERVED-IN-TRACE
    mame_hint: hdadsp_special_w case 6 sets m_adsp_irq_state; update_interrupts routes it to main CPU input line 2; hd68k_adsp_irq_clear_w clears it
    observed_contract: ADSP DM($2006) GINT -> 68010 IRQ 2 -> handler 0x0213fe -> write 0x818060 at 0x021402 -> RTE
  - from: jsa2
    to: maincpu
    kind: interrupt_callback
    evidence: MAME-CONFIRMED
    mame_hint: sound_int_write_line

