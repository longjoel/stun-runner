candidate_experiments:
  - id: DM-EXP-001
    name: adsp_upload
    watch_region: adsp_program_window
    start: power_on
    stop: title_checkpoint
    goal: identify main-CPU DSP upload writers and dump runtime ADSP program image
  - id: DM-EXP-002
    name: adsp_data_traffic
    watch_region: adsp_data_window
    mode: change-only
    goal: locate command status and shared-data hot spots
  - id: DM-EXP-003
    name: main_input_xref
    landmark: main_input_in0
    goal: identify digital input polling and normalization path
  - id: DM-EXP-004
    name: adc_differential
    landmark: adc_12bit_channel_3_landmark
    goal: correlate physical analog inputs with CPU-visible values and reader PCs
  - id: DM-EXP-005
    name: sound_command_boundary
    goal: identify 68010-to-JSA command and acknowledgement protocol

assumption_conflicts:
