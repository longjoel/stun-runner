<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="space" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="55%" stop-color="#0b0720"/>
      <stop offset="100%" stop-color="#050310"/>
    </radialGradient>
    <linearGradient id="ringHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5a1f"/>
      <stop offset="55%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#7a0f2b"/>
    </linearGradient>
    <linearGradient id="ringCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff5a1f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffd34d"/>
      <stop offset="100%" stop-color="#ff5a1f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#space)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="2"/><circle cx="200" cy="140" r="1.4"/>
    <circle cx="330" cy="70" r="1.8"/><circle cx="470" cy="120" r="1.2"/>
    <circle cx="620" cy="55" r="2"/><circle cx="760" cy="110" r="1.4"/>
    <circle cx="900" cy="60" r="1.8"/><circle cx="1040" cy="130" r="1.4"/>
    <circle cx="1130" cy="70" r="2"/><circle cx="120" cy="230" r="1.3"/>
    <circle cx="1090" cy="230" r="1.5"/><circle cx="60" cy="420" r="1.6"/>
    <circle cx="1150" cy="430" r="1.6"/><circle cx="180" cy="540" r="1.5"/>
    <circle cx="1010" cy="550" r="1.8"/><circle cx="420" cy="580" r="1.4"/>
    <circle cx="780" cy="585" r="1.4"/><circle cx="560" cy="40" r="1.3"/>
  </g>

  <!-- perspective tunnel rings, vanishing left-of-center -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="430" cy="300" rx="430" ry="270" stroke="url(#ringHot)" stroke-width="10" opacity="0.28"/>
    <ellipse cx="430" cy="300" rx="350" ry="218" stroke="url(#ringHot)" stroke-width="12" opacity="0.42"/>
    <ellipse cx="430" cy="300" rx="272" ry="168" stroke="url(#ringHot)" stroke-width="14" opacity="0.58"/>
    <ellipse cx="430" cy="300" rx="200" ry="122" stroke="url(#ringCool)" stroke-width="15" opacity="0.75"/>
    <ellipse cx="430" cy="300" rx="136" ry="82"  stroke="url(#ringCool)" stroke-width="16" opacity="0.9"/>
    <ellipse cx="430" cy="300" rx="80"  ry="48"  stroke="#ffd34d" stroke-width="16"/>
    <ellipse cx="430" cy="300" rx="34"  ry="20"  stroke="#fff6d8" stroke-width="10"/>
  </g>

  <!-- vector craft silhouette diving toward the tunnel -->
  <g transform="translate(860,330) rotate(-12) scale(1.7)">
    <polygon points="0,-14 96,0 0,14 22,0" fill="#e8ecf4"/>
    <polygon points="0,-14 96,0 22,0" fill="#ff2d55" opacity="0.85"/>
    <polygon points="18,-14 44,-34 52,-14" fill="#9aa3b5"/>
    <polygon points="18,14 44,34 52,14" fill="#9aa3b5"/>
    <rect x="96" y="-3" width="26" height="6" rx="3" fill="#ffd34d"/>
    <polygon points="122,-10 150,0 122,10" fill="#ff5a1f" opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="470" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="104" font-weight="bold" letter-spacing="6" fill="url(#titleGrad)">S.T.U.N. RUNNER</text>
  <text x="600" y="522" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="34" font-weight="bold" letter-spacing="14" fill="#8fd0ff">REVERSE-ENGINEERING PROJECT</text>
  <text x="600" y="566" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="24" letter-spacing="4" fill="#9aa3b5">MAME ORACLE &#183; EVIDENCE FIRST &#183; NATIVE PORT</text>
</svg>
